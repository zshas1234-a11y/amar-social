<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMAR Admin Users</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#050505;
color:white;
padding:30px;

}


h1{

color:#8b5cf6;
margin-bottom:30px;

}


.user-container{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}


.user-card{

background:#111;
padding:25px;
border-radius:20px;
border:1px solid #333;

}


.user-card h3{

color:#8b5cf6;
margin-bottom:15px;

}


.user-card p{

color:#aaa;
margin:8px 0;

}



.status{

display:inline-block;
padding:8px 15px;
border-radius:20px;
background:#166534;
margin-top:10px;

}



button{

margin-top:15px;
padding:10px 20px;
border:none;
border-radius:10px;
background:#8b5cf6;
color:white;
cursor:pointer;

}


button:hover{

background:#6d28d9;

}


</style>

</head>


<body>


<h1>
Users Management
</h1>



<div class="user-container">



<div class="user-card">

<h3>
Ali Ahmed
</h3>

<p>
Email:
ali@gmail.com
</p>

<p>
Orders:
5
</p>


<span class="status">
Active
</span>


<br>

<button>
View Profile
</button>

</div>




<div class="user-card">

<h3>
Ahmed Khan
</h3>

<p>
Email:
ahmed@gmail.com
</p>

<p>
Orders:
2
</p>


<span class="status">
Active
</span>


<br>

<button>
View Profile
</button>


</div>




<div class="user-card">

<h3>
New User
</h3>

<p>
Email:
user@gmail.com
</p>

<p>
Orders:
0
</p>


<span class="status">
Pending
</span>


<br>

<button>
Manage
</button>


</div>



</div>



</body>

</html>
