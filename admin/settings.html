<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMAR Admin Settings</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#050505;
color:white;
padding:30px;

}


h1{

color:#8b5cf6;
margin-bottom:30px;

}


.settings-box{

background:#111;
padding:30px;
border-radius:20px;
max-width:600px;

}



label{

display:block;
margin-top:15px;
color:#aaa;

}



input, textarea{

width:100%;
padding:14px;
margin-top:8px;
background:#222;
border:none;
border-radius:10px;
color:white;
outline:none;

}


textarea{

height:120px;
resize:none;

}



button{

margin-top:25px;
padding:14px 30px;
border:none;
border-radius:10px;
background:#8b5cf6;
color:white;
cursor:pointer;
font-size:16px;

}


button:hover{

background:#6d28d9;

}


</style>

</head>


<body>


<h1>
Website Settings
</h1>



<div class="settings-box">


<label>
Website Name
</label>

<input 
type="text"
value="AMAR SOCIAL HUB">



<label>
WhatsApp Number
</label>

<input 
type="text"
placeholder="+92XXXXXXXXXX">



<label>
Support Email
</label>

<input 
type="email"
placeholder="support@amarsocialhub.com">



<label>
Logo URL
</label>

<input 
type="text"
placeholder="Logo image link">



<label>
Homepage Announcement
</label>

<textarea
placeholder="Write announcement here...">
</textarea>



<button>
Save Settings
</button>



</div>



</body>

</html>
