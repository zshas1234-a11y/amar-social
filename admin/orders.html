<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMAR Admin Orders</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#050505;
color:white;
padding:30px;

}


h1{

color:#8b5cf6;
margin-bottom:30px;

}



table{

width:100%;
border-collapse:collapse;
background:#111;
border-radius:15px;
overflow:hidden;

}



th{

background:#8b5cf6;
padding:15px;
text-align:left;

}



td{

padding:15px;
border-bottom:1px solid #333;

}



.status{

padding:7px 15px;
border-radius:20px;
background:#222;

}



button{

padding:8px 15px;
border:none;
border-radius:8px;
background:#8b5cf6;
color:white;
cursor:pointer;

}



button:hover{

background:#6d28d9;

}



@media(max-width:700px){

table{

font-size:12px;

}

}

</style>


</head>


<body>


<h1>
Orders Management
</h1>



<table>


<tr>

<th>
Customer
</th>

<th>
Service
</th>

<th>
Amount
</th>

<th>
Payment
</th>

<th>
Status
</th>

<th>
Action
</th>


</tr>



<tr>

<td>
Ali Ahmed
</td>


<td>
Snapchat Plus Yearly
</td>


<td>
1750 PKR
</td>


<td>
Paid
</td>


<td>

<span class="status">
Pending
</span>

</td>


<td>

<button>
Approve
</button>

</td>


</tr>




<tr>

<td>
Ahmed Khan
</td>


<td>
AI Service
</td>


<td>
550 PKR
</td>


<td>
Paid
</td>


<td>

<span class="status">
Completed
</span>

</td>


<td>

<button>
View
</button>

</td>


</tr>



</table>



</body>

</html>
