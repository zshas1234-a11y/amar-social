<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMAR SOCIAL HUB Admin Dashboard</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:#050505;
    color:white;

}


.sidebar{

    width:250px;
    height:100vh;
    position:fixed;
    background:#111;
    padding:25px;

}


.logo{

    font-size:22px;
    font-weight:bold;
    color:#8b5cf6;
    margin-bottom:40px;

}


.sidebar a{

    display:block;
    color:white;
    text-decoration:none;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    background:#1a1a1a;

}


.sidebar a:hover{

    background:#8b5cf6;

}



.main{

    margin-left:270px;
    padding:30px;

}



h1{

    margin-bottom:30px;

}



.cards{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

}



.card{

    background:#111;
    padding:25px;
    border-radius:20px;
    border:1px solid #222;

}


.card h2{

    color:#8b5cf6;
    font-size:35px;

}


.card p{

    color:#aaa;

}



@media(max-width:700px){

.sidebar{

position:relative;
width:100%;
height:auto;

}


.main{

margin-left:0;

}

}


</style>


</head>


<body>

<div class="logo">

</html>
