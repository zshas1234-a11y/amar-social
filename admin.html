<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Social Hub Pro — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Login Form -->
    <div id="loginSection" class="flex-grow flex items-center justify-center">
        <div class="glass-card rounded-2xl p-8 max-w-md w-full text-center">
            <h1 class="font-orbitron font-extrabold text-2xl mb-4 text-cyan-400">ADMIN LOGIN</h1>
            <input type="password" id="adminPasswordInput" placeholder="Password (admin10)" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm mb-4 text-white focus:outline-none focus:border-cyan-500">
            <button onclick="checkAdminPassword()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-3 rounded-xl font-orbitron transition-all cursor-pointer">Login</button>
            <p id="loginError" class="text-red-400 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardSection" class="hidden max-w-6xl mx-auto w-full py-8 space-y-8">
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="font-orbitron text-2xl font-bold text-cyan-400">AMAR HUB ADMIN</h1>
            <button onclick="logout()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-orbitron hover:bg-red-500/30 cursor-pointer">Logout</button>
        </div>

        <!-- WhatsApp Configuration Box -->
        <div class="glass-card p-6 rounded-2xl">
            <h2 class="font-orbitron text-lg font-bold mb-2 text-white flex items-center space-x-2">
                <i class="fa-brands fa-whatsapp text-green-400 text-xl"></i>
                <span>WhatsApp Number Settings</span>
            </h2>
            <form id="settingsForm" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="whatsappInput" placeholder="e.g. 923001234567" required 
                    class="flex-grow bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-cyan-500 outline-none">
                <button type="submit" id="saveWhatsAppBtn" class="bg-green-500 hover:bg-green-400 text-black font-bold px-6 py-3 rounded-xl font-orbitron text-sm cursor-pointer">
                    Save WhatsApp
                </button>
            </form>
        </div>

        <!-- Add Service Box -->
        <div class="glass-card p-6 rounded-2xl">
            <h2 class="font-orbitron text-lg font-bold mb-4 text-white">Add New Service</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Service Title</label>
                    <input type="text" id="serviceName" placeholder="e.g. YouTube Views" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Price</label>
                    <input type="text" id="servicePrice" placeholder="e.g. 500" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="text-xs text-gray-400 block mb-1">Description</label>
                    <textarea id="serviceDesc" rows="3" placeholder="Service details..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-cyan-500 outline-none"></textarea>
                </div>

                <!-- Direct File Upload Field -->
                <div>
                    <label class="text-xs text-cyan-400 block mb-1 font-bold">Upload Image File (Gallery se photo chunen)</label>
                    <input type="file" id="serviceFileInput" accept="image/*" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-xs text-gray-300 focus:border-cyan-500 outline-none cursor-pointer">
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-1">Ya Image Link (URL)</label>
                    <input type="url" id="serviceImage" placeholder="https://..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:border-cyan-500 outline-none">
                </div>

                <div class="md:col-span-2 flex items-center justify-between pt-2">
                    <label class="text-sm text-gray-300"><input type="checkbox" id="serviceAvailable" checked class="mr-2"> Show on Website</label>
                    <button id="saveBtn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-8 py-3 rounded-xl font-orbitron cursor-pointer">Save Service</button>
                </div>
            </div>
        </div>

        <!-- Live Status Log Box -->
        <div class="glass-card p-4 rounded-2xl bg-black/40">
            <h3 class="text-xs font-orbitron text-cyan-400 mb-2 uppercase flex justify-between">
                <span>Live Status Log:</span>
                <button onclick="document.getElementById('statusLog').innerHTML=''" class="text-gray-500 hover:text-white text-[10px] cursor-pointer">Clear Log</button>
            </h3>
            <div id="statusLog" class="text-xs text-cyan-300 font-mono bg-gray-950 p-3 rounded-xl h-28 overflow-y-auto">System ready. Waiting for action...</div>
        </div>

        <!-- Catalog List -->
        <div class="glass-card p-6 rounded-2xl">
            <h2 class="font-orbitron text-lg font-bold mb-4 text-white">Current Services</h2>
            <div id="servicesList" class="space-y-3">
                <p class="text-gray-500 text-sm">Loading services...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeFirestore, collection, getDocs, addDoc, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrrUQLMes8TcRXbEk1I1a8D6vnhAFaLNvI",
            authDomain: "amar-d755e.firebaseapp.com",
            projectId: "amar-d755e",
            storageBucket: "amar-d755e.firebasestorage.app",
            messagingSenderId: "761406989668",
            appId: "1:761406989668:web:d26bb2ee84ac257a150671"
        };

        function logStatus(msg) {
            const box = document.getElementById('statusLog');
            if(box) {
                const time = new Date().toLocaleTimeString();
                box.innerHTML += `[${time}] ${msg}<br>`;
                box.scrollTop = box.scrollHeight;
            }
            console.log(msg);
        }

        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = initializeFirestore(app, {}, 'default');
            logStatus("SUCCESS: Firebase initialized.");
        } catch(err) {
            logStatus("ERROR: " + err.message);
        }

        window.checkAdminPassword = function() {
            const p = document.getElementById('adminPasswordInput').value;
            if(p === "admin10") {
                sessionStorage.setItem("auth", "true");
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadSettings();
                loadServices();
            } else {
                document.getElementById('loginError').textContent = "Galat Password!";
                document.getElementById('loginError').classList.remove('hidden');
            }
        };

        window.logout = function() {
            sessionStorage.removeItem("auth");
            location.reload();
        };

        if(sessionStorage.getItem("auth") === "true") {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            setTimeout(() => { loadSettings(); loadServices(); }, 500);
        }

        async function loadSettings() {
            try {
                const docSnap = await getDoc(doc(db, "settings", "public"));
                if(docSnap.exists() && docSnap.data().whatsappNumber) {
                    document.getElementById('whatsappInput').value = docSnap.data().whatsappNumber;
                }
            } catch(err) { console.error(err); }
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const whatsappNum = document.getElementById('whatsappInput').value.trim();
            try {
                await setDoc(doc(db, "settings", "public"), { whatsappNumber: whatsappNum }, { merge: true });
                alert("WhatsApp number save ho gaya!");
            } catch(err) { alert("Error: " + err.message); }
        });

        async function loadServices() {
            const list = document.getElementById('servicesList');
            try {
                const snap = await getDocs(collection(db, "services"));
                list.innerHTML = '';
                if(snap.empty) {
                    list.innerHTML = `<p class="text-gray-500 text-sm">Koi service database mein nahi hai.</p>`;
                    return;
                }
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-4 bg-gray-900/60 rounded-xl border border-gray-800";
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            ${data.imageUrl ? `<img src="${data.imageUrl}" class="w-10 h-10 rounded-lg object-cover">` : ''}
                            <div>
                                <span class="font-bold text-white">${data.name}</span>
                                <span class="text-cyan-400 font-orbitron ml-3">${data.price}</span>
                            </div>
                        </div>
                        <button onclick="removeService('${docSnap.id}')" class="text-red-400 text-xs hover:underline cursor-pointer">Delete</button>
                    `;
                    list.appendChild(div);
                });
            } catch(e) { logStatus("ERROR loading -> " + e.message); }
        }

        window.removeService = async function(id) {
            if(confirm("Delete karna chahte hain?")) {
                try {
                    await deleteDoc(doc(db, "services", id));
                    loadServices();
                } catch(err) { alert(err.message); }
            }
        }

        // Convert selected image file to Base64 String
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const name = document.getElementById('serviceName').value.trim();
            const price = document.getElementById('servicePrice').value.trim();
            const description = document.getElementById('serviceDesc').value.trim();
            const available = document.getElementById('serviceAvailable').checked;
            const fileInput = document.getElementById('serviceFileInput');
            let imageUrl = document.getElementById('serviceImage').value.trim();

            if(!name || !price || !description) {
                alert("Title, Price aur Description zaroor bharein!");
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            try {
                saveBtn.disabled = true;
                saveBtn.textContent = "Saving...";

                // Process uploaded file if selected
                if(fileInput.files && fileInput.files[0]) {
                    logStatus("Processing image file...");
                    imageUrl = await fileToBase64(fileInput.files[0]);
                }

                logStatus("Writing to database...");
                await addDoc(collection(db, "services"), {
                    name, price, description, imageUrl, available, createdAt: new Date()
                });

                logStatus("SUCCESS: Service saved with image!");
                alert("Service picture ke sath save ho gayi hai!");

                document.getElementById('serviceName').value = '';
                document.getElementById('servicePrice').value = '';
                document.getElementById('serviceDesc').value = '';
                document.getElementById('serviceImage').value = '';
                fileInput.value = '';

                loadServices();
            } catch(err) {
                logStatus("FAILED -> " + err.message);
                alert("Error: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = "Save Service";
            }
        });
    </script>
</body>
</html>
